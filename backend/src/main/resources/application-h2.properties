# Local development H2 database configuration
# Use a file-backed H2 database so registered users persist across backend restarts.
spring.datasource.url=jdbc:h2:file:./data/hardware_ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Keep security and AI config from default profile, if needed
jwt.secret=9a4f2c8d3b7a1e5f8c6b3a2f1e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d
jwt.expiration=86400000
gemini.api.key=${GEMINI_API_KEY:mock_mode_key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Server configuration
server.port=${SERVER_PORT:8080}
#server.servlet.context-path=/api

# Database Configuration (MySQL for development)
spring.datasource.url=jdbc:mysql://localhost:3306/hardware_ecommerce?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Platform Detection
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.database=MYSQL

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 Console (disabled in the current MySQL-based setup)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Remove duplicate /api context path because controllers already define /api/** paths.
# server.servlet.context-path=/api

# JWT Security Configuration
# 256-bit secret key for signing HS256 tokens (HMAC-SHA256)
jwt.secret=9a4f2c8d3b7a1e5f8c6b3a2f1e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d
# 1 Day (in milliseconds)
jwt.expiration=86400000

# AI Configuration (Gemini API)
# Paste your real Gemini API key here or define GEMINI_API_KEY environment variable.
gemini.api.key=${GEMINI_API_KEY:mock_mode_key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
